name: Build firmware using published build image

on:
  workflow_dispatch:
    inputs:
      bl_release:
        description: "openmotion-bl release tag to bundle into the production image (default: latest)"
        required: false
        default: "latest"
  push:
    branches: [ "main", "next" ]
    tags:
      - "*.*.*"
      - "*.*.*-rc.*"
      - "*.*.*-dev.*"

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#
#   FW_SIGNING_KEY     ECDSA P-256 *private* signing key, full PEM (multi-line).
#                      MUST be the private half of the public key embedded in the
#                      openmotion-bl bootloader (SECoreBin). Used to sign the slot
#                      image so the bootloader will accept it. NEVER commit this.
#
#   SECOREBIN_AES_KEY  AES-128 key as base64 of the raw 16 bytes. Same value as
#                      the openmotion-bl secret of the same name. The CBC crypto
#                      scheme's sign step requires it (sign_firmware.py --aes-key).
#
#   (No token is needed for OpenwaterHealth/open-motion-console-bl access —
#   the repo is public, so the built-in github.token covers the py-tools
#   checkout and the bootloader release download. #55: the old BL_REPO_TOKEN
#   PAT dated from when that repo was private; when it expired it 401'd every
#   build. If the bl repo ever goes private again, restore a read-access
#   cross-repo credential at the three github.token sites below.)
#
# These keys already exist in openmotion-bl (public key committed there; private
# + AES keys are the working-tree key material). Reuse the SAME keypair — a new
# keypair would require re-keying and rebuilding the bootloader.
# ---------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Fail fast (before the minutes-long builds) with a clear message if any
      # signing secret is missing, instead of a cryptic error deep in the run.
      # (#55: open-motion-console-bl access needs no secret — the repo is
      # public, so the workflow's own github.token covers the release lookup,
      # the py-tools checkout, and the binary download. If that repo ever goes
      # private, those three steps need a cross-repo credential again.)
      - name: Check required secrets
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
          SECOREBIN_AES_KEY: ${{ secrets.SECOREBIN_AES_KEY }}
        run: |
          missing=0
          for v in FW_SIGNING_KEY SECOREBIN_AES_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret '$v' is not set. Add it under" \
                   "Settings -> Secrets and variables -> Actions."
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "All required secrets present."

      # ---------------------------
      # Determine build config from the ref:
      #   *-dev.* tag            -> Debug   (development pre-release)
      #   *-rc.* / X.Y.Z tag     -> Release (release candidate / final release)
      #   branch push / dispatch -> Debug
      # ---------------------------
      - name: Determine build config
        id: cfg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG_NAME=$(python3 -c "import json;print(json.load(open('$GITHUB_EVENT_PATH'))['release']['tag_name'])")
            IS_TAG=1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=1
          else
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=0
          fi
          if [ "$IS_TAG" = "1" ] && [[ "$TAG_NAME" != *-dev.* ]]; then
            CONFIG=Release
          else
            CONFIG=Debug
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "ref='$GITHUB_REF' event='$GITHUB_EVENT_NAME' tag='$TAG_NAME' -> build config: $CONFIG"

      # ---------------------------
      # FwVersion is a uint16 consumed by the bootloader's monotonic anti-rollback
      # floor. Derive it from a release tag X.Y.Z as X*10000 + Y*100 + Z (supports
      # up to 6.55.35); non-release builds sign as version 1.
      # WARNING: anti-rollback means a unit that has booted version N will REFUSE
      # any image < N until re-flashed. Keep release versions monotonic. Revisit
      # this mapping if the versioning policy changes.
      # ---------------------------
      - name: Compute signing FW version
        id: fwver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            V=$(( ${BASH_REMATCH[1]}*10000 + ${BASH_REMATCH[2]}*100 + ${BASH_REMATCH[3]} ))
            [ "$V" -lt 1 ] && V=1
            [ "$V" -gt 65535 ] && V=65535
          else
            V=1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Signing FwVersion: $V"

      - name: Pull build image
        run: docker pull ghcr.io/openwaterhealth/stm32-build-env:latest

      # Slot image: runs under the custom bootloader from the active slot
      # (linked at 0x08020400). This is the image that gets signed.
      - name: Build slot image (@0x08020400)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "git config --global --add safe.directory /workspace && cmake --preset ${{ steps.cfg.outputs.config }} && cmake --build build/${{ steps.cfg.outputs.config }} --config ${{ steps.cfg.outputs.config }} --target all -j 10"

      # Bare-metal image: standalone at 0x08000000, no bootloader (BARE_METAL=ON).
      - name: Build bare-metal image (@0x08000000)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "git config --global --add safe.directory /workspace && cmake --preset ${{ steps.cfg.outputs.config }}-BareMetal && cmake --build build/${{ steps.cfg.outputs.config }}-BareMetal --config ${{ steps.cfg.outputs.config }} --target all -j 10"

      # ---------------------------
      # Resolve which openmotion-bl release to bundle. Uses the workflow_dispatch
      # input when given, otherwise the latest published bootloader release.
      # ---------------------------
      # #55: open-motion-console-bl is public — the built-in github.token is
      # enough for gh here (gh refuses to run tokenless in Actions, but any
      # valid token reads public releases). A dedicated PAT would only be
      # needed again if that repo goes private, and an EXPIRED one is worse
      # than none: GitHub 401s bad credentials even on public endpoints.
      - name: Resolve openmotion-bl release tag
        id: bl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REQ="${{ github.event.inputs.bl_release }}"
          if [ -z "$REQ" ] || [ "$REQ" = "latest" ]; then
            TAG=$(gh release view --repo OpenwaterHealth/open-motion-console-bl --json tagName --jq .tagName)
          else
            TAG="$REQ"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Bundling openmotion-bl @ $TAG"

      # Pull the signing tool + public key from the SAME pinned bootloader version
      # so the signing format always matches the bootloader that will verify it.
      - name: Fetch signing tool from openmotion-bl
        uses: actions/checkout@v4
        with:
          repository: OpenwaterHealth/open-motion-console-bl
          ref: ${{ steps.bl.outputs.tag }}
          token: ${{ github.token }}
          path: _bl
          sparse-checkout: py-tools

      - name: Download bootloader binary from openmotion-bl release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          gh release download "${{ steps.bl.outputs.tag }}" \
            --repo OpenwaterHealth/open-motion-console-bl \
            --pattern 'openmotion-bl.bin' \
            --dir _artifacts --clobber
          test -s _artifacts/openmotion-bl.bin

      # ---------------------------
      # Sign the slot image with the ECDSA private key (+ AES key) from secrets.
      # Keys are materialised only into a tmp dir and removed after use; they are
      # never written into the repo tree.
      # ---------------------------
      - name: Sign the slot image
        env:
          FW_SIGNING_KEY: ${{ secrets.FW_SIGNING_KEY }}
          SECOREBIN_AES_KEY: ${{ secrets.SECOREBIN_AES_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$FW_SIGNING_KEY" ] || [ -z "$SECOREBIN_AES_KEY" ]; then
            echo "::error::FW_SIGNING_KEY and SECOREBIN_AES_KEY secrets must be set to sign the slot image." >&2
            exit 1
          fi
          python3 -m pip install --quiet 'cryptography>=41'
          KD="$(mktemp -d)"
          trap 'rm -rf "$KD"' EXIT
          printf '%s\n' "$FW_SIGNING_KEY" > "$KD/ecdsa_private.pem"
          printf '%s' "$SECOREBIN_AES_KEY" | base64 -d > "$KD/aes128.bin"
          if [ "$(wc -c < "$KD/aes128.bin")" -ne 16 ]; then
            echo "::error::Decoded AES key is not 16 bytes — check SECOREBIN_AES_KEY." >&2
            exit 1
          fi
          APP="build/${{ steps.cfg.outputs.config }}/motion-console-fw.bin"
          test -s "$APP"
          python3 _bl/py-tools/sign_firmware.py \
            --firmware "$APP" \
            --private-key "$KD/ecdsa_private.pem" \
            --aes-key "$KD/aes128.bin" \
            --version "${{ steps.fwver.outputs.version }}" \
            --output _artifacts/motion-console-fw-signed.bin
          test -s _artifacts/motion-console-fw-signed.bin
          echo "Signed slot image: motion-console-fw-signed.bin (FwVersion=${{ steps.fwver.outputs.version }})"

      # ---------------------------
      # Production image = bootloader (@0x08000000) + signed app (@0x08020000),
      # merged into a single flashable image for factory programming.
      # ---------------------------
      - name: Assemble production image (bootloader + signed app)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          BL  = "_artifacts/openmotion-bl.bin"
          APP = "_artifacts/motion-console-fw-signed.bin"
          OUT = "_artifacts/motion-console-production.bin"
          SLOT_OFFSET = 0x08020000 - 0x08000000   # 0x20000 (bootloader occupies sector 0)
          bl  = open(BL, "rb").read()
          app = open(APP, "rb").read()
          if len(bl) > SLOT_OFFSET:
              raise SystemExit(f"bootloader ({len(bl)} B) overlaps app slot at 0x{SLOT_OFFSET:x}")
          img = bytearray(b"\xff" * SLOT_OFFSET)
          img[:len(bl)] = bl
          img += app
          with open(OUT, "wb") as f:
              f.write(img)
          print(f"production image: {len(img)} bytes (bootloader={len(bl)} B, signed app={len(app)} B)")
          PY
          # Intel-HEX view of the same image at load base 0x08000000
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "arm-none-eabi-objcopy -I binary -O ihex --change-addresses=0x08000000 _artifacts/motion-console-production.bin _artifacts/motion-console-production.hex"
          test -s _artifacts/motion-console-production.hex

      # Collect the bare-metal image with an unambiguous name (both preset builds
      # otherwise emit the same motion-console-fw.* basename).
      - name: Collect bare-metal artifact
        run: |
          set -euo pipefail
          cp "build/${{ steps.cfg.outputs.config }}-BareMetal/motion-console-fw.bin" _artifacts/motion-console-fw-baremetal.bin
          cp "build/${{ steps.cfg.outputs.config }}-BareMetal/motion-console-fw.hex" _artifacts/motion-console-fw-baremetal.hex

      # Upload as three separate, clearly-named artifacts (each shows as its own
      # row) rather than one opaque bundle:
      #   - baremetal : standalone app @0x08000000 (no bootloader)
      #   - signed    : app @0x08020400 signed for the bootloader slot
      #   - production : bootloader + signed app, single factory image
      - name: Upload bare-metal artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-console-fw-baremetal
          if-no-files-found: error
          path: |
            _artifacts/motion-console-fw-baremetal.bin
            _artifacts/motion-console-fw-baremetal.hex

      - name: Upload signed slot artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-console-fw-signed
          if-no-files-found: error
          path: _artifacts/motion-console-fw-signed.bin

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-console-production
          if-no-files-found: error
          path: |
            _artifacts/motion-console-production.bin
            _artifacts/motion-console-production.hex

      - name: Detect release type
        id: reltype
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|dev)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognized tag format: $TAG_NAME" >&2
            exit 1
          fi

      - name: Capture build metadata
        id: buildmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          : > notes.md

          if [[ "${{ steps.reltype.outputs.prerelease }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" >> notes.md
          else
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" >> notes.md
          fi

          echo "" >> notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "**Build SHA:** \`${{ steps.buildmeta.outputs.sha }}\`" >> notes.md
          echo "**Build Time:** ${{ steps.buildmeta.outputs.datetime }}" >> notes.md
          echo "**Build Config:** ${{ steps.cfg.outputs.config }}" >> notes.md
          echo "**Bundled bootloader:** \`${{ steps.bl.outputs.tag }}\`" >> notes.md
          echo "**Signed FwVersion:** \`${{ steps.fwver.outputs.version }}\`" >> notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.reltype.outputs.prerelease }}
          body_path: notes.md
          overwrite_files: true
          make_latest: ${{ steps.reltype.outputs.prerelease == 'false' }}
          files: |
            _artifacts/motion-console-fw-baremetal.bin
            _artifacts/motion-console-fw-baremetal.hex
            _artifacts/motion-console-fw-signed.bin
            _artifacts/motion-console-production.bin
            _artifacts/motion-console-production.hex
