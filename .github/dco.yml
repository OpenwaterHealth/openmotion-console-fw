# Configuration for the DCO GitHub App (https://github.com/apps/dco).
# Lets a missing Signed-off-by be fixed with a remediation commit instead of
# rewriting history, so release tags stay reachable from main.
allowRemediationCommits:
  individual: true   # the author adds their own sign-off later
  thirdParty: true   # someone else adds it on the author's behalf
