name: Build firmware using published build image

on:
  workflow_dispatch: {}
  push:
    branches: [ "main", "next" ]
    tags:
      - "*.*.*"
      - "*.*.*-rc.*"
      - "*.*.*-dev.*"

permissions:
  contents: write

# ---------------------------------------------------------------------------
# Developer build. Produces UNSIGNED images only:
#   - bare-metal image(s) at 0x08000000 (no bootloader)
#   - the slot image linked at 0x08020400, unsigned
#
# It holds no secret and has no Google Cloud identity. Signing with the console
# key in Google Cloud KMS, and the factory image (bootloader + signed app), are
# produced only by clinical-build.yml: manual, approval-gated, run on a release
# tag. For bench work against a Debug bootloader built from local test keys,
# sign the slot image locally with the bootloader repo's py-tools/sign_firmware.py.
#
# Setup and operations: OpenwaterHealth/OpenWater-KMS, docs/RUNBOOK-kms-signing-setup.md.
# ---------------------------------------------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # ---------------------------
      # Determine build config from the ref:
      #   *-dev.* tag            -> Debug   (development pre-release)
      #   *-rc.* / X.Y.Z tag     -> Release (release candidate / final release)
      #   branch push / dispatch -> Debug
      # ---------------------------
      - name: Determine build config
        id: cfg
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG_NAME=$(python3 -c "import json;print(json.load(open('$GITHUB_EVENT_PATH'))['release']['tag_name'])")
            IS_TAG=1
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=1
          else
            TAG_NAME="$GITHUB_REF_NAME"; IS_TAG=0
          fi
          if [ "$IS_TAG" = "1" ] && [[ "$TAG_NAME" != *-dev.* ]]; then
            CONFIG=Release
          else
            CONFIG=Debug
          fi
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "ref='$GITHUB_REF' event='$GITHUB_EVENT_NAME' tag='$TAG_NAME' -> build config: $CONFIG"

      - name: Pull build image
        run: docker pull ghcr.io/openwaterhealth/stm32-build-env:latest

      # Slot image: runs under the custom bootloader from the active slot
      # (linked at 0x08020400). This is the image that gets signed.
      - name: Build slot image (@0x08020400)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "git config --global --add safe.directory /workspace && cmake --preset ${{ steps.cfg.outputs.config }} && cmake --build build/${{ steps.cfg.outputs.config }} --config ${{ steps.cfg.outputs.config }} --target all -j 10"

      # Bare-metal image: standalone at 0x08000000, no bootloader (BARE_METAL=ON).
      - name: Build bare-metal image (@0x08000000)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/workspace \
            -w /workspace \
            ghcr.io/openwaterhealth/stm32-build-env:latest \
            bash -lc "git config --global --add safe.directory /workspace && cmake --preset ${{ steps.cfg.outputs.config }}-BareMetal && cmake --build build/${{ steps.cfg.outputs.config }}-BareMetal --config ${{ steps.cfg.outputs.config }} --target all -j 10"

      # The slot image is UNSIGNED here; see the header. Collected under an explicit
      # name so it cannot be mistaken for a signed/installable image.
      - name: Collect unsigned slot artifact
        run: |
          set -euo pipefail
          mkdir -p _artifacts
          for ext in bin hex; do
            f="build/${{ steps.cfg.outputs.config }}/motion-console-fw.$ext"
            [ -f "$f" ] && cp "$f" "_artifacts/motion-console-fw-slot-unsigned.$ext"
          done
          test -s _artifacts/motion-console-fw-slot-unsigned.bin

      # Collect the bare-metal image with an unambiguous name (both preset builds
      # otherwise emit the same motion-console-fw.* basename).
      - name: Collect bare-metal artifact
        run: |
          set -euo pipefail
          cp "build/${{ steps.cfg.outputs.config }}-BareMetal/motion-console-fw.bin" _artifacts/motion-console-fw-baremetal.bin
          cp "build/${{ steps.cfg.outputs.config }}-BareMetal/motion-console-fw.hex" _artifacts/motion-console-fw-baremetal.hex

      # Upload as separate, clearly-named artifacts (each shows as its own
      # row) rather than one opaque bundle:
      #   - baremetal : standalone app @0x08000000 (no bootloader)
      - name: Upload bare-metal artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-console-fw-baremetal
          if-no-files-found: error
          path: |
            _artifacts/motion-console-fw-baremetal.bin
            _artifacts/motion-console-fw-baremetal.hex

      - name: Upload unsigned slot artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-console-fw-slot-unsigned
          if-no-files-found: error
          path: |
            _artifacts/motion-console-fw-slot-unsigned.bin
            _artifacts/motion-console-fw-slot-unsigned.hex

      - name: Detect release type
        id: reltype
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(rc|dev)\.[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unrecognized tag format: $TAG_NAME" >&2
            exit 1
          fi

      - name: Capture build metadata
        id: buildmeta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "datetime=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          : > notes.md

          if [[ "${{ steps.reltype.outputs.prerelease }}" == "true" ]]; then
            echo "⚠️ **PRE-RELEASE – NOT FOR PRODUCTION**" >> notes.md
            echo "" >> notes.md
          fi

          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)

          if [ -z "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" >> notes.md
          else
            git log "$PREV_TAG"..HEAD --pretty=format:"- %s" >> notes.md
          fi

          echo "" >> notes.md
          echo "" >> notes.md
          echo "---" >> notes.md
          echo "**Build SHA:** \`${{ steps.buildmeta.outputs.sha }}\`" >> notes.md
          echo "**Build Time:** ${{ steps.buildmeta.outputs.datetime }}" >> notes.md
          echo "**Build Config:** ${{ steps.cfg.outputs.config }}" >> notes.md
          echo "" >> notes.md
          echo "Developer build: all images here are **unsigned** (bare-metal and slot). Signed field-update images and the factory production image for this tag come from the manual *Clinical build* workflow and are not published here." >> notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.reltype.outputs.prerelease }}
          body_path: notes.md
          overwrite_files: true
          make_latest: ${{ steps.reltype.outputs.prerelease == 'false' }}
          # Release assets: the unsigned bare-metal image(s) and the unsigned slot image
          # (decision 2026-10-08: bare-metal builds stay public; the application side of
          # CVA R10 - signed-only installs in clinical builds - is handled in the SDK).
          # Signed and production images are never here; they come from the clinical build
          # and live only in the private bucket.
          files: |
            _artifacts/motion-console-fw-baremetal.bin
            _artifacts/motion-console-fw-baremetal.hex
            _artifacts/motion-console-fw-slot-unsigned.bin
